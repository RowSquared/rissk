# Template run configuration for rissk_readme.ipynb.
# Copy per survey (e.g. fbf.yaml) and schedule the notebook with the single
# Notebook Jobs parameter:  CONFIG_FILE = "notebooks/configs/fbf.yaml"
# Absolute paths work too, so configs kept outside git are fine.
# Any key omitted here keeps the notebook's default (or an injected job parameter).

S3_BUCKET: s3://surveytool   # bucket root; survey folders live directly below
SURVEY: fbf                  # S3 folder: <S3_BUCKET>/<SURVEY>/latest/  — adjust!

# One entry per questionnaire (the legacy env.yaml QUESTIONAIRE list).
# VERSION: [] means "all versions found". Optional per-entry filter_var, e.g.
#   filter_var: {consent_q: "1"}
QUESTIONNAIRES:
  - name: fbf_household      # adjust to your survey's questionnaire name
    VERSION: [13]

# Kedro pipelines to execute, in order. Any ordered subset of:
#   data_ingestion, feature_creation, rissk_scoring
PIPELINES: [data_ingestion, feature_creation, rissk_scoring]

ZIP_PASSWORD: null           # password of the Survey Solutions export zips, if any
DATA_ROOT: data              # relative to rissk_kedro/, or an absolute path

SYNC_DOWN: true              # sync input zips down from S3 before running
SYNC_UP: true                # sync generated stages back to S3 after running
CLEAN_LOCAL: true            # delete the local questionnaire folder after upload
AWS_DRYRUN: false            # add --dryrun to aws commands
