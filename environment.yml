name: rissk_kedro
channels:
  - conda-forge
dependencies:
  - python=3.13
  # R Core - 3.13 compatible binaries (not used in pipeline code)
  - r-base>=4.4
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-stringr
  # Graphviz System Deps 
  - graphviz
  - python-graphviz
  - pydot              
  - pip
  - pip:
      # Framework
      - kedro==1.2.0
      - kedro-viz>=12.3.0
      - kedro-datasets[pandas,s3fs,excel,files]>=9.1.0 
      
      # GUI
      - nicegui>=1.4

      # Visualisation notebooks (notebooks/viz/)
      - marimo>=0.9
      - altair>=5.0

      # Core Stack
      - rpy2>=3.6.4          
      - pandas>=2.2.3
      - numpy>=2.1.0         
      - pyarrow>=18.0.0      
      
      # Analysis Tools
      - pyod>=1.1.5          
      - pythresh>=1.0.3      
      - tqdm>=4.67.0
      - boto3>=1.35.0
      - python-dotenv>=1.0.1

      # Notebook Jobs (register the env as a Jupyter kernel)
      - ipykernel>=6.29

      # Both workspace packages, editable. pip ignores [tool.uv.workspace], so each
      # must be listed explicitly — otherwise `import rissk_kedro` (driver, viz,
      # pipelines) fails in the conda env.
      - -e .
      - -e ./rissk_kedro