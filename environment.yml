name: rissk_kedro
channels:
  - conda-forge
dependencies:
  - python=3.13
  # R Core - 3.13 compatible binaries (not used in pipeline code)
  - r-base>=4.4
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-stringr
  # Graphviz System Deps 
  - graphviz
  - python-graphviz
  - pydot              
  - pip
  - pip:
      # Framework
      - kedro==1.2.0
      - kedro-viz>=12.3.0
      - kedro-datasets[pandas,s3fs,excel,files]>=9.1.0 
      
      # GUI
      - nicegui>=1.4

      # Core Stack
      - rpy2>=3.6.4          
      - pandas>=2.2.3
      - numpy>=2.1.0         
      - pyarrow>=18.0.0      
      
      # Analysis Tools
      - pyod>=1.1.5          
      - pythresh>=1.0.3      
      - loguru>=0.7.3
      - tqdm>=4.67.0
      - boto3>=1.35.0
      - python-dotenv>=1.0.1
      - -e .