name: rissk
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  # R and its dependencies
  - r-base
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-shiny
  - r-readr
  - r-irkernel  # For running R in Jupyter Notebooks
  - r-stringr
  # Interoperability
  - rpy2  # For using R within Python
  # Graphing libs
  - graphviz
  - pygraphviz
  # Other tools
  - pip
  - pip:
      - jupyter_contrib_nbextensions
      - awscli
      - botocore
      - loguru==0.7.3
      - tqdm==4.67.1
      - pandas==2.2.2
      - seaborn==0.13.2
      - docutils==0.16
      - openpyxl==3.1.2
      - pyarrow==15.0.2
      - pyod==1.1.3
      - python-dotenv==1.0.1
      - pythresh==0.3.6
      - ploomber==0.23.3
      - ipywidgets==8.1.5
      - typer==0.15.1
      - -e .