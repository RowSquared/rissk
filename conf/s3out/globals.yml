# s3out — read zips LOCALLY, write all generated outputs (20→40) to S3.
#   input_root  = local          — zips at  <input_root>/<survey>/latest/10_RAW/<name>_*.zip
#   work_root   = local          — ALWAYS local: zips are fetched + unzipped here
#   output_root = s3://<bucket>  — stages 20→40 at  <output_root>/<survey>/latest/<stage>/
# Requires s3fs + AWS credentials in the environment (standard chain: env vars or ~/.aws).
# Run with:  kedro run --env s3out
input_root: "data"
work_root: "data"
output_root: "s3://surveytool"      # ← replace with your bucket
survey: grdslchbs_test
