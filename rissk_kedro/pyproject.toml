[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
# NOTE: named "rissk-pipeline" to avoid collision with the root "rissk" ML package
# in the uv workspace. The installed Python package is still "rissk_kedro".
name = "rissk-pipeline"
version = "0.1.2"
description = "Kedro pipeline for RISSK — Survey Quality Control."
authors = [{ name = "rowsquared" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

# Minimal runtime dependencies — only what the pipeline actually imports.
dependencies = [
    "rissk",                                          # ML logic (workspace root package)
    "kedro==1.2.0",
    "kedro-datasets[pandas]>=9.1.0",                  # parquet + CSV + PartitionedDataset
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "pyod>=1.1.5",
    "scipy>=1.10",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov",
]

# Tell uv where to find the "rissk" package (workspace sibling at repo root).
[tool.uv.sources]
rissk = { workspace = true }

[tool.kedro]
package_name = "rissk_kedro"
project_name = "rissk"
kedro_init_version = "1.2.0"
source_dir = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.kedro_telemetry]
project_id = "63718528078e46d1bd5fa456d349edb2"
