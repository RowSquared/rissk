# Here you can define all your data sets by using simple YAML syntax.
#
# === RAW DATA ===
# The source partitions (Zips)
survey_zip_partitions:
  type: partitions.PartitionedDataset
  path: data/${globals:survey.name}/latest/10_RAW
  dataset:
    type: rissk_kedro.datasets.PathDataset
    filename_suffix: ".zip"

# The extracted result (Folders)
# Used by downstream nodes to find the directories
extracted_survey_folders:
  type: partitions.PartitionedDataset
  path: data/${globals:survey.name}/latest/10_RAW
  dataset:
    type: rissk_kedro.datasets.PathDataset

# === INGESTED DataFrames ===
paradata_interim:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/20_INTERIM/paradata.parquet

raw_questionnaire:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/30_PROCESSED/questionnaire.parquet

raw_microdata:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/30_PROCESSED/microdata.parquet

paradata_processed:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/30_PROCESSED/paradata_processed.parquet

paradata_active:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/30_PROCESSED/paradata_active.parquet

# === FEATURE CREATION DataFrames ===
item_features_base:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/20_INTERIM/item_features_base.parquet

unit_features_base:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/20_INTERIM/unit_features_base.parquet

# Final Feature Tables (Input to Risk Scoring)
item_features:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/30_PROCESSED/item_features.parquet

unit_features:
  type: pandas.ParquetDataset
  filepath: data/${globals:survey.name}/latest/30_PROCESSED/unit_features.parquet

# === LEGACY DATA FOR TESTING ===
legacy_microdata:
  type: pandas.ParquetDataset
  filepath: /Users/vanessa/Work/Rowsquared/RISSK/rissk/data/hies2024/latest/30_PROCESSED/microdata.parquet

legacy_paradata_active:
  type: pandas.ParquetDataset
  filepath: /Users/vanessa/Work/Rowsquared/RISSK/rissk/data/hies2024/latest/30_PROCESSED/paradata_active.parquet