# Survey Configuration has to be defined in globals.yml
survey:
  # This tells Kedro to pull the entire block from globals.yml
  questionnaires: ${globals:survey.questionnaires}

# # Ingestion Configuration
# ingestion:
#   raw_data_path: "data/hies2024/latest/10_RAW"      

# Set the password for zip files in local/parameters.yml if needed. 
# It will override the base/parameters.yml setting.
zip_password: null

# Processing Parameters
processing:
  limit_unit: null  # Set to filter by consent if needed
  automatic_contamination: false

# Feature Engineering Configuration (from configuration/main.yaml)
features:
  answer_hour_set:
    use: true
    contamination: 0.11
  answer_changed:
    use: true
    contamination: 0.1
  answer_removed:
    use: true
    contamination: 0.1
  answer_selected:
    use: true
    contamination: 0.1
  answer_duration:
    use: true
    contamination: 0.1
  first_decimal:
    use: true
    contamination: 0.11
    frequency: 100
  first_digit:
    use: true
  last_digit:
    use: false
  numeric_response:
    use: true
  sequence_jump:
    use: true
    contamination: 0.1
  time_changed:
    use: true
  gps:
    use: true
    sub_features: [gps_latitude, gps_longitude, gps_accuracy]
    contamination: 0.11
  pause_count:
    use: true
    contamination: 0.11
  pause_duration:
    use: true
    contamination: 0.11
  pause_list:
    use: false
  number_unanswered:
    use: false
  number_answered:
    use: true
    contamination: 0.11
  total_duration:
    use: true
    contamination: 0.11
  total_elapse:
    use: true
    contamination: 0.11
  single_question:
    use: true
  multi_option_question:
    use: true
  days_from_start:
    use: false

# Output Configuration
output:
  feature_score: true
  unit_risk_score_path: "results/unit_risk_score.csv"