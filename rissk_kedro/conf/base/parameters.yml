# Survey Configuration has to be defined in globals.yml
survey:
  # This tells Kedro to pull the entire block from globals.yml
  questionnaires: ${globals:survey.questionnaires}
     
# Set the password for zip files in local/parameters.yml if needed. 
# It will override the base/parameters.yml setting.
zip_password: null

# Processing Parameters
processing:
  limit_unit: null  # Set to filter by consent if needed
  automatic_contamination: false

# Feature Engineering Configuration (from configuration/main.yaml)
features:
  answer_hour_set:
    use: true
    parameters:
      contamination: 0.1
  answer_changed:
    use: true
    parameters:
      contamination: 0.1
  answer_removed:
    use: true
    parameters:
      contamination: 0.1
  answer_selected:
    use: true
    parameters:
      contamination: 0.1
  answer_duration:
    use: true
    parameters:
      contamination: 0.1
  first_decimals:
    use: true
    parameters:
      contamination: 0.1
  first_digit:
    use: true # numeric_response must be set to true also for this to work
  last_digit:
    use: false
  numeric_response:
    use: true 
  sequence_jump:
    use: true
    parameters:
      contamination: 0.1
  time_changed:
    use: true
  gps:
    use: true
    sub_features: [gps_latitude, gps_longitude, gps_accuracy]
    parameters:
      contamination: 0.1
  pause_count:
    use: true
    parameters:
      contamination: 0.1
  pause_duration:
    use: true
    parameters:
      contamination: 0.1
  pause_list:
    use: false
    parameters:
      contamination: 0.1
  comment_length:
    use: false
  comment_set:
    use: false
  comment_duration:
    use: false
  number_unanswered:
    use: true
  number_answered:
    use: true
    parameters:
      contamination: 0.1
  total_duration:
    use: true
    parameters:
      contamination: 0.1
  total_elapse:
    use: true
    parameters:
      contamination: 0.1
  single_question:
    use: true
  multi_option_question:
    use: true
  days_from_start:
    use: true
  answer_position:
    use: true
  string_length:
    use: false
  