# Questionnaire Configuration

# Root folder that contains all questionnaire data subfolders.
# Can be a relative path (relative to rissk_kedro/) or an absolute path.
# Override this in conf/local/globals.yml to point to your data on disk.
data_root: "data"

# questionnaire:
#   name: "slbhies_listing"
#   VERSION: [5, 6, 7]
#   filter_var: null  # Set to a single-key dict to filter by consent, e.g.:
#   # filter_var: {consent_q: "1"}
#   # Only interviews where paradata variable 'consent_q' has answer "1" are scored.
#   # The answer value must be a string (paradata answers are always strings).

questionnaire:
  name: "snb_hies_hh"
  VERSION: [9, 10, 11]
  filter_var: null

