# Data catalog. Paths come from globals (conf/base + the selected env):
#   ${globals:work_root}   — LOCAL staging for 10_RAW (zips fetched + extracted here).
#   ${globals:output_root} — outputs 20→40 (local or s3://).
#   keyed by  <survey>.
#
# === RAW DATA (local staging — unzip + folder reads are local-filesystem only) ===
# Zips staged by stage_input_zips_node from <input_root>/<survey>/latest/10_RAW/<name>_*.zip
survey_zip_partitions:
  type: partitions.PartitionedDataset
  path: ${globals:work_root}/${globals:survey}/latest/10_RAW
  dataset:
    type: rissk.datasets.PathDataset
    filename_suffix: ".zip"

# The extracted result (folders)
extracted_survey_folders:
  type: partitions.PartitionedDataset
  path: ${globals:work_root}/${globals:survey}/latest/10_RAW
  dataset:
    type: rissk.datasets.PathDataset

# === INGESTED DataFrames ===
paradata_raw:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/20_INTERIM/paradata_raw.parquet

raw_questionnaire:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/30_PROCESSED/questionnaire.parquet

raw_microdata:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/20_INTERIM/microdata_raw.parquet

microdata:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/30_PROCESSED/microdata.parquet

paradata_processed:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/30_PROCESSED/paradata_processed.parquet


# === FEATURE CREATION DataFrames ===
item_features_base:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/20_INTERIM/item_features_base.parquet

unit_features_base:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/20_INTERIM/unit_features_base.parquet

item_features:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/30_PROCESSED/item_features.parquet

unit_features:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/30_PROCESSED/unit_features.parquet

# Aggregated AnswerRemoved events (used by rissk_scoring for unit-level s__answer_removed).
removed_answers:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/30_PROCESSED/removed_answers.parquet


# === SCORING DataFrames ===
item_scores:
  type: pandas.ParquetDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/35_SCORES/item_scores.parquet

unit_rissk_scores:
  type: pandas.CSVDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/35_SCORES/unit_rissk_scores.csv

responsible_scores:
  type: pandas.CSVDataset
  filepath: ${globals:output_root}/${globals:survey}/latest/35_SCORES/responsible_scores.csv
