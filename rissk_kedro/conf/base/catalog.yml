# Here you can define all your data sets by using simple YAML syntax.
#
# === RAW DATA ===
# The source partitions (Zips)
survey_zip_partitions:
  type: partitions.PartitionedDataset
  path: ${globals:data_root}/${globals:questionnaire.name}/latest/10_RAW
  dataset:
    type: rissk_kedro.datasets.PathDataset
    filename_suffix: ".zip"

# The extracted result (Folders)
# Used by downstream nodes to find the directories
extracted_survey_folders:
  type: partitions.PartitionedDataset
  path: ${globals:data_root}/${globals:questionnaire.name}/latest/10_RAW
  dataset:
    type: rissk_kedro.datasets.PathDataset

# === INGESTED DataFrames ===
paradata_raw:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/20_INTERIM/paradata_raw.parquet

raw_questionnaire:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/30_PROCESSED/questionnaire.parquet

raw_microdata:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/20_INTERIM/microdata_raw.parquet

microdata:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/30_PROCESSED/microdata.parquet

paradata_processed:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/30_PROCESSED/paradata_processed.parquet


# === FEATURE CREATION DataFrames ===
item_features_base:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/20_INTERIM/item_features_base.parquet

unit_features_base:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/20_INTERIM/unit_features_base.parquet

  # Final Feature Tables (Input to Risk Scoring)
item_features:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/30_PROCESSED/item_features.parquet

unit_features:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/30_PROCESSED/unit_features.parquet

# Aggregated AnswerRemoved events (includes items deleted from microdata).
# Used by the rissk_scoring pipeline to compute s__answer_removed at unit level,
# matching legacy get_feature_item__answer_removed / make_score_unit__answer_removed.
removed_answers:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/30_PROCESSED/removed_answers.parquet


# === SCORING DataFrames ===
item_scores:
  type: pandas.ParquetDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/40_SCORED/item_scores.parquet

unit_rissk_scores:
  type: pandas.CSVDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/40_SCORED/unit_rissk_scores.csv

responsible_scores:
  type: pandas.CSVDataset
  filepath: ${globals:data_root}/${globals:questionnaire.name}/latest/40_SCORED/responsible_scores.csv
