# Here you can define all your data sets by using simple YAML syntax.
#
# === INTERMEDIATE (Raw Data Files) ===
survey_partitions:
  type: partitions.PartitionedDataset
  path: data/hies2024/latest/10_RAW
  dataset:
    type: binary.BinaryDataset
  filename_suffix: ""

# === PRIMARY (Ingested DataFrames) ===
paradata_interim:
  type: pandas.ParquetDataset
  filepath: data/hies2024/latest/20_INTERIM/paradata.parquet

raw_questionnaire:
  type: pandas.ParquetDataset
  filepath: data/hies2024/latest/30_PROCESSED/questionnaire.parquet

raw_microdata:
  type: pandas.ParquetDataset
  filepath: data/hies2024/latest/30_PROCESSED/microdata.parquet

paradata_processed:
  type: pandas.ParquetDataset
  filepath: data/hies2024/latest//30_PROCESSED/paradata_processed.parquet

paradata_active:
  type: pandas.ParquetDataset
  filepath: data/hies2024/latest/30_PROCESSED/paradata_active.parquet

